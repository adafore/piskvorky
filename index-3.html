<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zasedací pořádek třídy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">
  <div class="card">

    <header>
      <div class="title-row">
        <span class="logo">🪑</span>
        <h1>Zasedací pořádek</h1>
      </div>
      <div class="switcher">
        <button id="btn-fyzika" class="active">Fyzika</button>
        <button id="btn-normal">Normální třída</button>
      </div>
      <p class="hint">Klikni na volnou židli a napiš své jméno. Uvidí to úplně všichni v reálném čase.</p>
    </header>

    <main id="app">

      <!-- FYZIKA -->
      <section id="layout-fyzika" class="layout">
        <div class="teacher-row">
          <div class="seat teacher" data-id="f-teacher">
            <span class="seat-icon"></span>
            <span class="seat-label">Učitel</span>
            <span class="seat-name"></span>
          </div>
        </div>

        <div class="benches-row">
          <div class="block block-4" id="f-block-left"></div>
          <div class="aisle"></div>
          <div class="block block-3" id="f-block-right"></div>
        </div>
      </section>

      <!-- NORMAL -->
      <section id="layout-normal" class="layout hidden">
        <div class="normal-grid" id="n-grid"></div>
      </section>

    </main>
  </div>
</div>

<!-- Modal na zadání jména -->
<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal">
    <h2 id="modal-title">Kdo tu sedí?</h2>
    <input id="modal-input" type="text" maxlength="30" placeholder="Napiš jméno..." autocomplete="off">
    <div class="modal-buttons">
      <button id="modal-clear" class="btn-ghost">Uvolnit židli</button>
      <div class="modal-buttons-right">
        <button id="modal-cancel" class="btn-secondary">Zrušit</button>
        <button id="modal-save" class="btn-primary">Uložit</button>
      </div>
    </div>
  </div>
</div>

<div id="status" class="status"></div>

<script type="module" src="firebase-config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
