<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zasedací pořádek třídy</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Zasedací pořádek</h1>
  <div class="switcher">
    <button id="btn-fyzika" class="active">Fyzika</button>
    <button id="btn-normal">Normální třída</button>
  </div>
  <p class="hint">Klikni na židli a napiš své jméno. Vidí to úplně všichni v reálném čase.</p>
</header>

<main id="app">

  <!-- FYZIKA -->
  <section id="layout-fyzika" class="layout">
    <div class="teacher-row">
      <div class="seat teacher" data-id="f-teacher">
        <span class="seat-label">Učitel</span>
        <span class="seat-name"></span>
      </div>
    </div>

    <div class="benches-row">
      <div class="block block-4" id="f-block-left"></div>
      <div class="aisle"></div>
      <div class="block block-3" id="f-block-right"></div>
    </div>
  </section>

  <!-- NORMAL -->
  <section id="layout-normal" class="layout hidden">
    <div class="normal-grid" id="n-grid"></div>
  </section>

</main>

<div id="status" class="status"></div>

<script type="module" src="firebase-config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
